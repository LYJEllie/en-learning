<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课本英语 vs 地道英语</title>
<meta name="description" content="英语情景答题小游戏：三条命，三个真实场面，说错一句气氛就凉一次。">
<style>
/* ============================================================
   课本英语 vs 地道英语 —— 英语情景答题小游戏
   复古扁平 / Neo-brutalism：米底 + 粗黑边 + 硬投影
   红 #ff4757 = 踩雷    绿 #2ed573 = 地道    黄 #f1c40f = 生硬
   开发版：题库在 ../data/*.js，跑 node build.mjs 合成根目录单文件 index.html
   ============================================================ */

:root{
  --bg:        #f7f1e3;
  --card:      #fcfaf2;
  --white:     #ffffff;
  --ink:       #111111;
  --dark:      #2f3542;
  --muted:     #57606f;
  --line:      #dfe4ea;
  --red:       #ff4757;
  --red-deep:  #c72c39;
  --red-soft:  #fff0f1;
  --green:     #2ed573;
  --green-deep:#0b5d33;
  --green-soft:#eefbf3;
  --blue:      #1e90ff;
  --yellow:    #f1c40f;
  --yellow-deep:#8a6d00;
  --shadow:    12px 12px 0px var(--ink);
  --shadow-md: 6px 6px 0px var(--ink);
  --shadow-sm: 3px 3px 0px var(--ink);
  --cn: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
  --en: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

*{ box-sizing:border-box; margin:0; padding:0; font-family:var(--cn); }

body{
  background-color:var(--bg);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  padding:24px 20px 60px;
  color:var(--dark);
  overflow-x:hidden;
}

.app{
  width:100%;
  max-width:540px;
  display:flex;
  flex-direction:column;
  gap:18px;
}
.app.is-hit{ animation:shake .45s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes shake{
  10%,90%{ transform:translate3d(-4px,0,0); }
  20%,80%{ transform:translate3d(7px,0,0); }
  30%,50%,70%{ transform:translate3d(-11px,0,0); }
  40%,60%{ transform:translate3d(11px,0,0); }
}

/* ---------- 血量 + 进度 HUD ---------- */
.hud{
  background-color:var(--white);
  border:4px solid var(--ink);
  border-radius:12px;
  box-shadow:var(--shadow-md);
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
}
.hud[hidden]{ display:none; }

.hearts{ display:flex; gap:6px; align-items:center; }
.heart{ width:30px; height:30px; display:block; transform-origin:50% 60%; }
.heart .shape{ fill:var(--red); stroke:var(--ink); stroke-width:9; }
.heart.is-lost .shape{ fill:var(--line); stroke:#a4b0be; }
.heart.is-lost{ transform:rotate(-16deg) scale(.85); opacity:.7; }
.heart.is-breaking{ animation:breakHeart .55s ease-out both; }
@keyframes breakHeart{
  0%{ transform:scale(1) rotate(0); }
  30%{ transform:scale(1.6) rotate(8deg); }
  60%{ transform:scale(.78) rotate(-20deg); }
  100%{ transform:rotate(-16deg) scale(.85); }
}

.progress{ display:flex; align-items:center; gap:10px; }
.counter{
  font-size:13px;
  font-weight:700;
  color:var(--muted);
  letter-spacing:1px;
  font-variant-numeric:tabular-nums;
}
.counter b{ color:var(--red); font-size:20px; }
.bar{
  width:clamp(110px,30vw,170px);
  height:16px;
  border:3px solid var(--ink);
  border-radius:99px;
  background-color:var(--line);
  overflow:hidden;
}
.bar__fill{
  display:block;
  height:100%;
  width:0;
  background-color:var(--blue);
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 5px,transparent 5px 10px);
  transition:width .45s cubic-bezier(.2,.9,.25,1);
}

/* ---------- 卡片 ---------- */
.card{
  background-color:var(--card);
  border:4px solid var(--ink);
  border-radius:12px;
  box-shadow:var(--shadow);
  padding:34px 28px;
  position:relative;
  transition:background-color .3s ease, border-color .3s ease;
  animation:cardIn .28s ease-out both;
}
.card--center{ text-align:center; }
/* 答对：浅绿底 + 绿边 / 答错：浅红底 + 红边 */
.card.is-ok{ background-color:var(--green-soft); border-color:var(--green-deep); }
.card.is-ng{ background-color:var(--red-soft);   border-color:var(--red); }
@keyframes cardIn{ from{ transform:translateY(12px); opacity:0; } to{ transform:none; opacity:1; } }

/* ---------- 封面 ---------- */
.sub-lang-title{
  font-family:var(--en);
  font-size:14px;
  color:var(--muted);
  letter-spacing:4px;
  margin-bottom:24px;
  font-weight:700;
  text-transform:uppercase;
}
.title-vs-box{ margin-bottom:24px; }
.main-title{
  font-size:clamp(32px,8.4vw,42px);
  font-weight:900;
  letter-spacing:3px;
  line-height:1.2;
}
.red-title{ color:var(--red); text-shadow:2px 2px 0px rgba(0,0,0,.1); }
.blue-title{ color:var(--dark); }
.vs-text{
  font-family:var(--en);
  font-size:24px;
  font-weight:900;
  color:var(--red);
  margin:8px 0;
  font-style:italic;
}
.desc-text{
  font-size:15px;
  color:var(--muted);
  line-height:1.8;
  margin-bottom:30px;
  padding:0 10px;
}

/* 虚线规则卡 */
.rules-card{
  border:2px dashed var(--dark);
  padding:20px;
  text-align:left;
  border-radius:6px;
  display:grid;
  gap:12px;
}
.rule-item{
  font-size:14px;
  color:var(--dark);
  display:flex;
  align-items:flex-start;
  line-height:1.5;
}
.rule-item::before{
  content:"▶";
  color:var(--red);
  font-size:10px;
  margin-right:8px;
  margin-top:3px;
  flex:none;
}

/* ---------- 按钮 ---------- */
.start-btn{
  background-color:var(--ink);
  color:var(--white);
  border:none;
  padding:16px 36px;
  font-size:18px;
  font-weight:bold;
  border-radius:6px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:12px;
  margin-top:35px;
  transition:transform .2s ease, box-shadow .2s ease, background-color .2s ease;
  box-shadow:0 4px 0px #555;
}
.start-btn:hover{ transform:translateY(-2px); box-shadow:0 6px 0px #555; background-color:#222; }
.start-btn:active{ transform:translateY(2px); box-shadow:0 2px 0px #555; }
.start-btn:focus-visible{ outline:3px solid var(--red); outline-offset:4px; }
.start-btn .en-text{
  font-family:var(--en);
  font-size:16px;
  font-weight:800;
  letter-spacing:.5px;
  color:var(--yellow);
  border-right:1px solid #555;
  padding-right:12px;
  line-height:1.5;
}
.start-btn--pulse{ animation:pulseBtn 2s infinite; }
@keyframes pulseBtn{
  0%{ transform:scale(1); }
  50%{ transform:scale(1.03); box-shadow:0 4px 15px rgba(0,0,0,.2); }
  100%{ transform:scale(1); }
}
.start-btn--sm{ padding:13px 26px; font-size:16px; margin-top:20px; }
.start-btn--sm .en-text{ font-size:14px; }

/* ---------- 模式选择 ---------- */
.mode-label{
  margin-top:28px;
  font-size:12px;
  font-weight:700;
  letter-spacing:3px;
  color:var(--muted);
}
.mode-list{ display:grid; gap:12px; margin-top:12px; }
.mode-btn{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  text-align:left;
  background-color:var(--white);
  border:3px solid var(--ink);
  border-radius:10px;
  box-shadow:var(--shadow-sm);
  padding:14px 16px;
  cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, background-color .15s ease;
}
.mode-btn:hover{ transform:translate(-3px,-3px); box-shadow:var(--shadow-md); background-color:#fffdf3; }
.mode-btn:active{ transform:translate(0,0); box-shadow:var(--shadow-sm); }
.mode-btn:focus-visible{ outline:3px solid var(--blue); outline-offset:3px; }
.mode-btn__emoji{ flex:none; font-size:26px; line-height:1; }
.mode-btn__box{ display:grid; gap:3px; min-width:0; }
.mode-btn__name{ font-size:16px; font-weight:900; letter-spacing:1px; color:var(--ink); }
.mode-btn__sub{ font-size:12px; line-height:1.5; color:var(--muted); }
.mode-btn__go{
  flex:none;
  margin-left:auto;
  font-family:var(--en);
  font-size:12px;
  font-weight:900;
  letter-spacing:1px;
  color:var(--white);
  background-color:var(--ink);
  border-radius:99px;
  padding:5px 11px;
}
.mode-btn--kids .mode-btn__go{ background-color:var(--green-deep); }

.text-btn{
  display:inline-block;
  margin-top:14px;
  background:none;
  border:none;
  font-size:13px;
  font-weight:700;
  color:var(--muted);
  text-decoration:underline;
  text-underline-offset:4px;
  cursor:pointer;
}
.text-btn:hover{ color:var(--ink); }
.text-btn:focus-visible{ outline:3px solid var(--blue); outline-offset:3px; }

/* 当前模式标记（题面左上角） */
.mode-chip{
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  color:var(--white);
  background-color:var(--muted);
  border-radius:99px;
  padding:4px 10px;
}

/* ---------- 场景描述区 ---------- */
.scene-row{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.scene{
  display:inline-block;
  font-size:12px;
  font-weight:700;
  letter-spacing:2px;
  line-height:1.9;
  color:var(--white);
  background-color:var(--dark);
  border-radius:99px;
  padding:5px 14px;
}
/* 大号 emoji 图示：给还不认字的小朋友撑住题意（题目里写 emoji 字段才出现） */
.emoji-card{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:clamp(48px,14vw,76px);
  line-height:1.25;
  background-color:var(--white);
  border:3px solid var(--ink);
  border-radius:12px;
  box-shadow:var(--shadow-sm);
  padding:14px 12px;
  margin-bottom:18px;
  user-select:none;
}

/* 🔊 朗读按钮：启蒙档才出现，浏览器不支持语音合成时自动不渲染 */
.speak-btn{
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-family:var(--cn);
  font-size:12px;
  font-weight:700;
  color:var(--ink);
  background-color:var(--yellow);
  border:2px solid var(--ink);
  border-radius:99px;
  box-shadow:2px 2px 0px var(--ink);
  padding:4px 10px;
  margin-left:8px;
  cursor:pointer;
  vertical-align:middle;
  white-space:nowrap;
}
.speak-btn:hover{ transform:translate(-1px,-1px); box-shadow:3px 3px 0px var(--ink); }
.speak-btn:active{ transform:translate(1px,1px); box-shadow:1px 1px 0px var(--ink); }
.speak-btn:focus-visible{ outline:3px solid var(--blue); outline-offset:3px; }

/* 热度标签：激将文案，勾好胜心（题目里写 heat 字段才出现） */
.heat-tag{
  font-size:11px;
  font-weight:700;
  letter-spacing:.5px;
  color:var(--red-deep);
  background-color:var(--red-soft);
  border:2px solid var(--red);
  border-radius:99px;
  padding:4px 10px;
  white-space:nowrap;
}

/* 题型：这题在考"听力/说法/习惯/情商" */
.qtype{
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  color:var(--muted);
  background-color:var(--white);
  border:2px solid var(--line);
  border-radius:99px;
  padding:4px 10px;
}

.question-box{
  background-color:var(--white);
  border:2px solid var(--line);
  border-left:6px solid var(--yellow);
  border-radius:6px;
  padding:14px 16px;
  margin-bottom:18px;
}
.question-box .zh-line{
  font-size:14.5px;
  line-height:1.95;
  color:var(--dark);
}
.question-box .note-line{
  margin-top:8px;
  padding-top:8px;
  border-top:1px dashed var(--line);
  font-size:13px;
  line-height:1.7;
  color:var(--muted);
}
.question-box b{ color:var(--red); font-weight:700; }

/* 老外说的那句原话 */
.quote{
  font-family:var(--en);
  font-size:clamp(22px,6vw,30px);
  font-weight:900;
  letter-spacing:.5px;
  line-height:1.5;
  color:var(--ink);
  background-color:var(--white);
  border:3px solid var(--ink);
  border-radius:10px;
  box-shadow:var(--shadow-sm);
  padding:14px 18px;
  margin-bottom:18px;
  text-align:center;
  transform:rotate(-.6deg);
}
.quote small{
  display:block;
  font-family:var(--cn);
  font-size:12px;
  font-weight:700;
  letter-spacing:2px;
  color:var(--muted);
  margin-bottom:4px;
}

.ask{
  font-size:clamp(18px,4.6vw,22px);
  font-weight:900;
  letter-spacing:.5px;
  line-height:1.8;
  color:var(--dark);
  margin-bottom:20px;
}

/* ---------- 选项 ---------- */
.options-container{ display:grid; gap:12px; }

.option-card{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  text-align:left;
  background-color:var(--white);
  border:3px solid var(--ink);
  border-radius:8px;
  padding:12px 14px;
  cursor:pointer;
  color:var(--dark);
  transition:transform .15s ease, box-shadow .15s ease, background-color .2s ease, border-color .2s ease;
}
.option-card:hover:not(:disabled){ transform:translate(-3px,-3px); box-shadow:var(--shadow-sm); }
.option-card:focus-visible{ outline:3px solid var(--blue); outline-offset:3px; }
.option-card:disabled{ cursor:default; }

.option-left{ display:flex; align-items:center; gap:12px; min-width:0; }
.option-letter{
  flex:none;
  width:32px; height:32px;
  display:grid; place-items:center;
  font-family:var(--en);
  font-size:15px; font-weight:900;
  color:var(--white);
  background-color:var(--ink);
  border-radius:50%;
  transition:background-color .2s ease, color .2s ease;
}
.option-text-box{ display:grid; gap:2px; min-width:0; }
.option-card .en-text{
  font-family:var(--en);
  font-size:clamp(15px,3.9vw,17px);
  font-weight:800;
  line-height:1.55;
}
.option-card .zh-text{ font-size:12.5px; color:var(--muted); line-height:1.6; }

/* 语感标签：只表示"踩雷风险"，不直接表示对错 */
.badge{
  flex:none;
  margin-left:auto;
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  padding:4px 9px;
  border-radius:99px;
  border:2px solid currentColor;
  background-color:var(--white);
  white-space:nowrap;
}
.badge-trap  { color:var(--red); }
.badge-native{ color:var(--green-deep); }
.badge-stiff { color:var(--yellow-deep); }

/* 判定后的状态：浅底 + 同色描边 */
.option-card.is-right{
  background-color:var(--green-soft);
  border-color:var(--green-deep);
  box-shadow:var(--shadow-sm);
}
.option-card.is-right .option-letter{ background-color:var(--green-deep); color:var(--white); }
.option-card.is-right .zh-text{ color:var(--green-deep); }
.option-card.is-wrong{
  background-color:var(--red-soft);
  border-color:var(--red);
}
.option-card.is-wrong .option-letter{ background-color:var(--red); color:var(--white); }
.option-card.is-wrong .zh-text{ color:var(--red-deep); }
.option-card.is-dim{ opacity:.45; }

.tag-answer{
  flex:none;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  color:var(--white);
  background-color:var(--green-deep);
  border-radius:99px;
  padding:4px 9px;
  white-space:nowrap;
}

/* ---------- 讲解 ---------- */
.verdict{
  position:relative;
  overflow:hidden;
  margin-top:22px;
  border:3px solid var(--ink);
  border-radius:10px;
  padding:18px;
  animation:cardIn .3s ease-out both;
}
.verdict--ok{ background-color:#f1fdf6; }
.verdict--ng{ background-color:#fff2f3; }
.verdict > *:not(.verdict__watermark){ position:relative; }

/* 巨型半透明判定符号：1 秒内读懂输赢 */
.verdict__watermark{
  position:absolute;
  right:-30px;
  top:50%;
  width:clamp(180px,48vw,240px);
  transform:translateY(-50%) rotate(-8deg);
  pointer-events:none;
  user-select:none;
}
.verdict--ok .verdict__watermark{ color:var(--green); opacity:.18; }
.verdict--ng .verdict__watermark{ color:var(--red); opacity:.16; }

.verdict__head-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}
.verdict__icon{
  flex:none;
  width:46px; height:46px;
  padding:10px;
  border-radius:50%;
  border:3px solid var(--ink);
  box-shadow:var(--shadow-sm);
  animation:stampPop .45s cubic-bezier(.2,1.6,.4,1) both;
}
.verdict--ok .verdict__icon{ background-color:var(--green); color:var(--ink); }
.verdict--ng .verdict__icon{ background-color:var(--red); color:var(--white); }
@keyframes stampPop{
  0%{ transform:scale(2.6) rotate(-22deg); opacity:0; }
  60%{ transform:scale(.9) rotate(5deg); opacity:1; }
  100%{ transform:scale(1) rotate(0); opacity:1; }
}
.verdict__watermark svg,
.verdict__icon svg{ display:block; width:100%; height:100%; }

.verdict__head{
  font-size:19px;
  font-weight:900;
  letter-spacing:1px;
  line-height:1.35;
}
.verdict--ok .verdict__head{ color:#128046; }
.verdict--ng .verdict__head{ color:var(--red-deep); }
.verdict p{ font-size:14px; line-height:2; color:var(--dark); margin-bottom:8px; }
.verdict p:last-of-type{ margin-bottom:0; }
.verdict .en{ font-family:var(--en); font-weight:800; color:var(--ink); }

/* 黄色进阶框 */
.bonus-box{
  margin-top:16px;
  background-color:#fff8dd;
  border:2px dashed var(--yellow);
  border-radius:6px;
  padding:12px 14px;
  font-size:13.5px;
  line-height:2;
  color:var(--muted);
}
.bonus-box__label{
  display:inline-block;
  font-size:11px;
  font-weight:700;
  letter-spacing:2px;
  color:var(--white);
  background-color:var(--yellow-deep);
  border-radius:99px;
  padding:2px 10px;
  margin-bottom:6px;
}
.highlight{
  font-family:var(--en);
  font-weight:800;
  color:var(--ink);
  text-decoration:underline;
  text-decoration-color:var(--yellow);
  text-decoration-thickness:3px;
  text-underline-offset:3px;
  text-decoration-skip-ink:none;
}

/* ---------- 冲击字 ---------- */
.impact{
  position:fixed;
  left:50%; top:40%;
  z-index:40;
  transform:translate(-50%,-50%);
  text-align:center;
  pointer-events:none;
  animation:impact 1.1s cubic-bezier(.2,1.4,.4,1) both;
}
.impact__en{
  font-family:var(--en);
  font-size:clamp(42px,12vw,80px);
  font-weight:900;
  line-height:1.15;
  letter-spacing:1px;
  color:var(--white);
  -webkit-text-stroke:7px var(--ink);
  paint-order:stroke fill;
  transform:rotate(-6deg);
}
.impact--ng .impact__en{ color:var(--red); }
.impact--ok .impact__en{ color:var(--green); }
.impact__cn{
  display:inline-block;
  margin-top:12px;
  font-size:clamp(16px,4vw,22px);
  font-weight:900;
  color:var(--ink);
  background-color:var(--white);
  border:3px solid var(--ink);
  border-radius:6px;
  box-shadow:var(--shadow-sm);
  padding:6px 16px;
  transform:rotate(-2deg);
}
@keyframes impact{
  0%{ transform:translate(-50%,-50%) scale(2.6); opacity:0; }
  18%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
  70%{ transform:translate(-50%,-50%) scale(1); opacity:1; }
  100%{ transform:translate(-50%,-60%) scale(.94); opacity:0; }
}

/* ---------- 红屏闪烁 / 撒花 ---------- */
.flash{
  position:fixed; inset:0; z-index:30; pointer-events:none; opacity:0;
  background:radial-gradient(circle at 50% 45%, rgba(255,71,87,.12) 0%, rgba(255,71,87,.85) 100%);
}
.flash.is-on{ animation:flash .55s ease-out both; }
@keyframes flash{ 0%{opacity:0;} 12%{opacity:1;} 40%{opacity:.25;} 60%{opacity:.8;} 100%{opacity:0;} }
.fx{ position:fixed; inset:0; z-index:35; pointer-events:none; }

/* ---------- 结算 ---------- */
.result-kicker{
  font-family:var(--en);
  font-size:13px;
  font-weight:800;
  letter-spacing:4px;
  color:var(--muted);
  margin-bottom:22px;
  text-transform:uppercase;
}
.badge-rank{
  width:clamp(170px,44vw,196px);
  height:clamp(170px,44vw,196px);
  margin:0 auto 22px;
  border:5px solid var(--ink);
  border-radius:50%;
  box-shadow:var(--shadow-md);
  background-color:var(--red);
  color:var(--white);
  display:grid;
  place-content:center;
  gap:8px;
  padding:14px;
  transform:rotate(-6deg);
  animation:badgeIn .5s cubic-bezier(.2,1.5,.4,1) both;
}
.badge-rank--win{ background-color:var(--green); color:var(--ink); }
@keyframes badgeIn{
  0%{ transform:rotate(-22deg) scale(2.1); opacity:0; }
  100%{ transform:rotate(-6deg) scale(1); opacity:1; }
}
.badge-rank__label{ font-size:12px; letter-spacing:5px; font-weight:700; opacity:.85; }
.badge-rank__text{ font-size:clamp(21px,5.6vw,27px); font-weight:900; line-height:1.25; letter-spacing:1px; }
.result-en{
  font-family:var(--en);
  font-size:18px;
  font-weight:800;
  line-height:1.8;
  color:var(--dark);
  margin-bottom:10px;
}
.score{
  display:inline-flex;
  align-items:baseline;
  gap:6px;
  font-size:16px;
  font-weight:700;
  color:var(--dark);
  background-color:var(--white);
  border:3px solid var(--ink);
  border-radius:99px;
  padding:8px 20px;
  font-variant-numeric:tabular-nums;
}
.score b{ font-size:26px; font-weight:900; color:var(--red); }
.result-note{
  font-size:14px;
  line-height:1.85;
  color:var(--muted);
  margin:18px auto 0;
  max-width:30em;
}
.recap{ list-style:none; margin-top:26px; display:grid; gap:10px; text-align:left; }
.recap li{
  display:flex; gap:10px; align-items:center;
  background-color:var(--white);
  border:2px solid var(--line);
  border-radius:8px;
  padding:10px 12px;
  font-size:13.5px;
  line-height:1.8;
}
.recap__mark{
  flex:none;
  width:26px; height:26px;
  display:grid; place-items:center;
  border-radius:50%;
  font-size:14px; font-weight:900;
  color:var(--white);
}
.recap__mark--ok{ background-color:var(--green); color:var(--ink); }
.recap__mark--ng{ background-color:var(--red); }
.recap__en{ display:block; font-family:var(--en); font-weight:800; font-size:12.5px; color:var(--muted); }
.recap__take{ display:block; font-weight:700; color:var(--dark); }
.recap-title{
  margin-top:26px;
  font-size:12px;
  font-weight:700;
  letter-spacing:3px;
  color:var(--muted);
  text-align:left;
}
.recap-title + .recap{ margin-top:10px; }

/* 弱项诊断 */
.diagnosis{
  display:inline-block;
  margin-top:14px;
  font-size:13.5px;
  color:var(--dark);
  background-color:var(--white);
  border:2px dashed var(--muted);
  border-radius:99px;
  padding:7px 18px;
}
.diagnosis b{ color:var(--red); }

/* 题库自检报错条 */
.alert{
  border:4px solid var(--red);
  border-radius:12px;
  background-color:#fff2f3;
  box-shadow:var(--shadow-md);
  padding:14px 18px;
  font-size:13px;
  line-height:1.8;
  color:var(--red-deep);
}
.alert[hidden]{ display:none; }
.alert ul{ margin:6px 0 0 18px; }

/* ---------- 底部：累计访问量计数器 ---------- */
.visit-counter{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding-top:14px;
  border-top:2px dashed var(--line);
  font-size:11px;
  font-weight:700;
  letter-spacing:1px;
  color:var(--muted);
}
.visit-counter[hidden]{ display:none; }
.visit-counter img{
  border:2px solid var(--ink);
  border-radius:3px;
  padding:2px;
  background-color:var(--white);
  box-shadow:2px 2px 0px var(--ink);
  vertical-align:middle;
}

/* ---------- 页脚金句（深灰色调） ---------- */
.footnote{
  font-family:var(--en);
  text-align:center;
  font-size:13px;
  font-weight:700;
  line-height:2;
  letter-spacing:1px;
  color:#4b5360;
}

@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
</style>
</head>
<body>

<div class="flash" id="flash" aria-hidden="true"></div>
<canvas class="fx" id="fx" aria-hidden="true"></canvas>

<div class="app" id="app">

  <div class="hud" id="hud" hidden>
    <div class="hearts" id="hearts" aria-label="剩余血量"></div>
    <div class="progress">
      <span class="counter"><b id="qnum">1</b> / <span id="qtotal">3</span></span>
      <div class="bar" id="bar" role="progressbar" aria-label="答题进度" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0">
        <span class="bar__fill" id="barFill"></span>
      </div>
    </div>
  </div>

  <!-- 题库自检报错条（正常情况下隐藏） -->
  <div class="alert" id="alert" hidden></div>

  <div id="screen" aria-live="polite"></div>

  <p class="footnote">English is a tool. Use it right, live it bright.</p>

  <!-- ============================================================
       累计访问量（hits.sh 免费挂件，返回一张 SVG 图片）
       计数用的 key 就是 URL 里那段路径：lyjellie.github.io/en-learning
       —— 想单独统计别的页面就换路径；想清零，换一个没用过的路径。
       配色：labelColor=111111（黑标签）、color=ff4757（红数字）
       挂件加载不出来时（离线 / 被拦截）整行自动隐藏，不留裂图。
       ============================================================ -->
  <div class="visit-counter" id="visitCounter">
    <span>累计访问</span>
    <img src="https://hits.sh/lyjellie.github.io/en-learning.svg?style=flat-square&amp;label=views&amp;color=ff4757&amp;labelColor=111111"
         alt="累计访问量"
         onerror="document.getElementById('visitCounter').hidden = true;">
  </div>
</div>

<script src="../data/_core.js"></script>
<script src="../data/starter-l1.js"></script>
<script src="../data/starter-l2.js"></script>
<script src="../data/starter-l3.js"></script>
<script src="../data/kids-hello.js"></script>
<script src="../data/kids-class.js"></script>
<script src="../data/kids-life.js"></script>
<script src="../data/kids-friend.js"></script>
<script src="../data/kids-trip.js"></script>
<script src="../data/adult.js"></script>
<script>
/* ============================================================
   ★ 第四段：引擎 ★
   洗牌抽题 / 血量 / 判定 / 特效 / 结算 —— 加题时不用动这一段
   ============================================================ */
(() => {
  "use strict";

  /* 题库来自 data/*.js —— 没加载成功就直说，别让用户对着白屏发呆 */
  const EN = window.EN;
  if (!EN) {
    const box = document.getElementById("alert");
    box.hidden = false;
    box.innerHTML = "<b>题库没有加载。</b><ul>" +
      "<li>直接打开 src/index.html 时，data/ 目录必须在它的上一级</li>" +
      "<li>要发布或分享，请用仓库根目录的 <b>index.html</b>（合并后的单文件版）</li></ul>";
    return;
  }
  const { CORE, MODES } = EN;
  const { ROUND, MAX_HP, TYPES } = CORE;

  /* 当前模式：封面选完才定。之后 M.BANK / M.PACKS / M.RANKS / M.文案 全从这里取 */
  let M = MODES.kids;

  const $ = (id) => document.getElementById(id);
  const app = $("app"), screen = $("screen"), hud = $("hud"), flash = $("flash");
  const heartsEl = $("hearts"), qnum = $("qnum"), bar = $("bar"), barFill = $("barFill");
  $("qtotal").textContent = ROUND;
  bar.setAttribute("aria-valuemax", String(ROUND));

  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const HEART_SVG = '<svg class="heart" viewBox="0 0 100 100" aria-hidden="true"><path class="shape" d="M50 86C24 68 8 52 8 34 8 21 18 12 30 12c8 0 15 4 20 11 5-7 12-11 20-11 12 0 22 9 22 22 0 18-16 34-42 52z"/></svg>';

  /* 判定符号：○ / ✕（SVG 绘制，不依赖系统字体） */
  const MARK = {
    ok: '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="31" fill="none" stroke="currentColor" stroke-width="15"/></svg>',
    ng: '<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M26 26 76 76M76 26 26 76" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round"/></svg>'
  };

  /* ========== 状态 ========== */
  let SET = [];   // 本局抽中的 3 道题
  const state = { index:0, hp:MAX_HP, correct:0, log:[], locked:false, opts:[] };

  /* ========== 🔊 朗读：启蒙档专用，点一下把英文念一遍 ==========
     用浏览器自带的语音合成，不联网、不加库；不支持的浏览器直接不渲染按钮。
     选项是中文释义（理解题）时也不渲染——用英文嗓子念中文只会更糊涂。 */
  const canSpeak = () => Boolean(M.speak) && "speechSynthesis" in window;

  function speakBtn(text){
    if (!canSpeak() || !/[A-Za-z]/.test(text)) return "";
    const say = String(text).replace(/"/g, "&quot;");
    return `<button class="speak-btn" type="button" data-say="${say}">🔊 听一遍</button>`;
  }

  screen.addEventListener("click", (e) => {
    const btn = e.target.closest && e.target.closest(".speak-btn");
    if (!btn) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(btn.dataset.say);
    u.lang = "en-US";
    u.rate = 0.8;          // 放慢一点，给刚起步的小朋友听清每个音
    speechSynthesis.speak(u);
  });

  /* ========== HUD ========== */
  function renderHearts(breakIndex = -1){
    heartsEl.innerHTML = HEART_SVG.repeat(MAX_HP);
    [...heartsEl.children].forEach((el, i) => {
      if (i >= state.hp) el.classList.add("is-lost");
      if (i === breakIndex && !reduced) el.classList.add("is-breaking");
    });
  }
  function renderProgress(){
    qnum.textContent = Math.min(state.index + 1, ROUND);
    barFill.style.width = (state.index / ROUND * 100) + "%";
    bar.setAttribute("aria-valuenow", String(state.index));
  }

  /* ========== 封面 ＝ 模式选择 ========== */
  function renderCover(){
    hud.hidden = true;

    const modes = Object.values(MODES).map(m => `
      <button class="mode-btn mode-btn--${m.key}" data-mode="${m.key}" type="button">
        <span class="mode-btn__emoji">${m.emoji}</span>
        <span class="mode-btn__box">
          <span class="mode-btn__name">${m.name}</span>
          <span class="mode-btn__sub">${m.BANK.length} 题 · ${m.sub}</span>
        </span>
        <span class="mode-btn__go">GO</span>
      </button>`).join("");

    screen.innerHTML = `
      <div class="card card--center">
        <div class="sub-lang-title">Real-life English Quiz</div>
        <div class="title-vs-box">
          <div class="main-title red-title">课本英语</div>
          <div class="vs-text">vs</div>
          <div class="main-title blue-title">地道英语</div>
        </div>
        <p class="desc-text">
          同一个场面，课本教一种说法，老外用另一种。<br>
          ${ROUND} 道题，三条命——说错一句，空气就凉一次。
        </p>
        <div class="rules-card">
          <div class="rule-item">共 ${ROUND} 题，每答错一题失去一颗心</div>
          <div class="rule-item">血量归零直接 GG，别指望硬刚</div>
          <div class="rule-item">每局洗牌随机抽题，同一局里场景不重样</div>
          <div class="rule-item">每题都有解析，可以用键盘 A / B / C 作答</div>
        </div>
        <div class="mode-label">选一个模式开始</div>
        <div class="mode-list">${modes}</div>
      </div>`;

    screen.querySelectorAll(".mode-btn").forEach(b => {
      b.addEventListener("click", () => startGame(b.dataset.mode));
    });
  }

  function startGame(modeKey){
    M = MODES[modeKey] || M;
    SET = EN.draw(M);
    state.index = 0; state.hp = MAX_HP; state.correct = 0; state.log = []; state.locked = false;
    hud.hidden = false;
    renderHearts();
    renderQuestion();
  }

  /* ========== 出题 ========== */
  function renderQuestion(){
    const q = SET[state.index];
    state.locked = false;
    renderProgress();

    const quoteHtml = q.quote
      ? `<div class="quote"><small>对方说</small>『${q.quote}』${speakBtn(q.quote)}</div>`
      : "";
    const emojiHtml = q.emoji ? `<div class="emoji-card" aria-hidden="true">${q.emoji}</div>` : "";
    const noteHtml = q.note ? `<p class="note-line">${q.note}</p>` : "";

    screen.innerHTML = `
      <div class="card" id="qcard">
        <div class="scene-row">
          <span class="scene">${q.scene}</span>
          ${q.heat ? `<span class="heat-tag">${q.heat}</span>` : ""}
          <span class="qtype">${TYPES[q.type].label}</span>
          <span class="mode-chip">${M.chip}</span>
        </div>

        <div class="question-box">
          <p class="zh-line">${q.situation}</p>
          ${noteHtml}
        </div>

        ${emojiHtml}
        ${quoteHtml}

        <h2 class="ask">${q.ask}</h2>

        <div class="options-container" id="options" role="group" aria-label="选项"></div>
        <div id="verdict"></div>
      </div>`;

    /* 本题实际显示的选项顺序（小学生模式每次打乱），判定也以它为准 */
    state.opts = M.shuffleOptions ? EN.shuffle(q.options) : q.options;

    const wrap = $("options");
    state.opts.forEach((opt, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "option-card";
      b.dataset.i = String(i);
      b.innerHTML = `
        <span class="option-left">
          <span class="option-letter">${"ABC"[i]}</span>
          <span class="option-text-box">
            <span class="en-text">${opt.text}</span>
            <span class="zh-text">${opt.note}</span>
          </span>
        </span>
        <span class="badge badge-${opt.kind}">${opt.badge}</span>`;
      b.addEventListener("click", () => answer(i));
      wrap.appendChild(b);
    });
  }

  /* ========== 判定 ========== */
  function answer(choice){
    if (state.locked) return;
    state.locked = true;

    const q = SET[state.index];
    const picked = state.opts[choice];
    const rightIndex = state.opts.findIndex(o => o.ok);
    const right = state.opts[rightIndex];
    const ok = picked.ok;

    // 整张卡片换色：答对浅绿底绿边，答错浅红底红边
    $("qcard").classList.add(ok ? "is-ok" : "is-ng");

    // 选项状态：正确项永远高亮（答错时也要指出正解在哪）
    [...$("options").children].forEach((el, i) => {
      el.disabled = true;
      if (i === rightIndex){
        el.classList.add("is-right");
        el.querySelector(".badge").outerHTML = '<span class="tag-answer">✓ 正解</span>';
      } else if (i === choice){
        el.classList.add("is-wrong");
      } else {
        el.classList.add("is-dim");
      }
    });

    state.log.push({ ok, picked, right, pack:q.pack, takeaway:q.takeaway });

    if (ok){
      state.correct++;
      impact(M.impactOk[0], M.impactOk[1], "ok");
      confetti();
    } else {
      state.hp = Math.max(0, state.hp - 1);
      renderHearts(state.hp);
      impact(M.impactNg[0], M.impactNg[1], "ng");
      redFlash();
      app.classList.remove("is-hit");
      void app.offsetWidth;
      app.classList.add("is-hit");
    }

    showVerdict(ok, q, picked, right);
  }

  function showVerdict(ok, q, picked, right){
    const last = state.index === ROUND - 1;
    const end = state.hp === 0 || last;

    const body = ok
      ? `<p><span class="en">${right.text}</span>${speakBtn(right.text)} —— ${right.why}</p>`
      : `<p>你选的 <span class="en">${picked.text}</span>：${picked.why}</p>
         <p>正解是 <span class="en">${right.text}</span>${speakBtn(right.text)} —— ${right.why}</p>`;

    const mark = ok ? MARK.ok : MARK.ng;
    const gg = state.hp === 0;

    $("verdict").innerHTML = `
      <div class="verdict ${ok ? "verdict--ok" : "verdict--ng"}">
        <span class="verdict__watermark">${mark}</span>
        <div class="verdict__head-row">
          <span class="verdict__icon">${mark}</span>
          <h3 class="verdict__head">${ok ? M.verdictOk : M.verdictNg}</h3>
        </div>
        ${body}
        <div class="bonus-box">
          <span class="bonus-box__label">避坑解析</span>
          <div>${q.explain}</div>
        </div>
        <button class="start-btn start-btn--sm" id="nextBtn" type="button">
          <span class="en-text">${end ? "Result" : "Next"}</span>
          <span>${gg ? "血量归零 💀" : end ? "查看结算 🏁" : "下一题 👉"}</span>
        </button>
      </div>`;

    $("nextBtn").addEventListener("click", () => {
      state.index++;
      renderProgress();
      if (state.hp === 0 || state.index >= ROUND) renderResult();
      else renderQuestion();
    });
  }

  /* ========== 结算 ========== */
  function renderResult(){
    const wiped = state.hp === 0;
    const r = M.RANKS.find(x => state.correct >= x.min);
    renderProgress();

    /* 带走清单：每题一条金句 */
    const recap = state.log.map(item => `
      <li>
        <span class="recap__mark recap__mark--${item.ok ? "ok" : "ng"}">${item.ok ? "○" : "×"}</span>
        <span>
          <span class="recap__take">${item.takeaway}</span>
          <span class="recap__en">${item.right.text}</span>
        </span>
      </li>`).join("");

    /* 弱项诊断：按错题所属大类归因 */
    const missed = state.log.filter(x => !x.ok);
    let diagnosis;
    if (!missed.length){
      diagnosis = `本局 ${state.log.length} 个场景零失误，语感在线。`;
    } else {
      const tally = {};
      missed.forEach(x => { tally[x.pack] = (tally[x.pack] || 0) + 1; });
      const worst = Object.entries(tally).sort((a, b) => b[1] - a[1]);
      diagnosis = "弱项：" + worst.map(([p, n]) => `<b>${M.PACKS[p].cn}</b> ${n} 次`).join(" ・ ");
    }

    screen.innerHTML = `
      <div class="card card--center">
        <div class="result-kicker">${wiped ? "Game Over ・ 血量归零" : "Result ・ 结算"}</div>
        <div class="badge-rank ${r.win ? "badge-rank--win" : ""}">
          <div class="badge-rank__label">称号</div>
          <div class="badge-rank__text">${r.rank}</div>
        </div>
        <p class="result-en">${r.en}</p>
        <p class="score">答对 <b>${state.correct}</b> / ${ROUND} ・ 剩余 HP ${state.hp}</p>
        <p class="result-note">${r.note}</p>
        <p class="diagnosis">${diagnosis}</p>
        <div class="recap-title">带走这 ${state.log.length} 句</div>
        <ul class="recap">${recap}</ul>
        <button class="start-btn start-btn--pulse" id="againBtn" type="button">
          <span class="en-text">One more</span>
          <span>再来一次 🔁</span>
        </button>
        <div><button class="text-btn" id="backBtn" type="button">← 换个模式</button></div>
      </div>`;

    if (state.correct === ROUND) confetti(150);
    $("againBtn").addEventListener("click", () => { startGame(M.key); window.scrollTo({ top:0 }); });
    $("backBtn").addEventListener("click", () => { renderCover(); window.scrollTo({ top:0 }); });
  }

  /* ========== 特效 ========== */
  function impact(en, cn, kind){
    const el = document.createElement("div");
    el.className = "impact impact--" + kind;
    el.innerHTML = `<div class="impact__en">${en}</div><div class="impact__cn">${cn}</div>`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), reduced ? 700 : 1200);
  }

  function redFlash(){
    flash.classList.remove("is-on");
    void flash.offsetWidth;
    flash.classList.add("is-on");
  }

  const fx = $("fx"), ctx = fx.getContext("2d");
  let parts = [], raf = null;

  function sizeCanvas(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    fx.width = innerWidth * dpr;
    fx.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  sizeCanvas();
  addEventListener("resize", sizeCanvas);

  const COLORS = ["#ff4757", "#2ed573", "#1e90ff", "#f1c40f", "#ffffff"];

  function confetti(count = 90){
    if (reduced) return;
    for (let i = 0; i < count; i++){
      parts.push({
        x: innerWidth * (0.5 + (Math.random() - 0.5) * 0.5),
        y: innerHeight * 0.4,
        vx: (Math.random() - 0.5) * 11,
        vy: -Math.random() * 13 - 4,
        w: 6 + Math.random() * 8,
        h: 8 + Math.random() * 10,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
        color: COLORS[(Math.random() * COLORS.length) | 0],
        round: Math.random() < 0.4,
        life: 1
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }

  function tick(){
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 60);
    for (const p of parts){
      p.vy += 0.34; p.vx *= 0.992; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.y > innerHeight * 0.7) p.life -= 0.02;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.strokeStyle = "#111111";
      ctx.lineWidth = 1.5;
      if (p.round){
        ctx.beginPath();
        ctx.ellipse(0, 0, p.w * 0.5, p.h * 0.5, 0, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
      } else {
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h);
      }
      ctx.restore();
    }
    if (parts.length) raf = requestAnimationFrame(tick);
    else { ctx.clearRect(0, 0, innerWidth, innerHeight); raf = null; }
  }

  /* ---- 键盘 A / B / C 作答 ---- */
  addEventListener("keydown", (e) => {
    const i = "abc".indexOf(e.key.toLowerCase());
    if (i < 0 || state.locked) return;
    const btn = document.querySelector(`.option-card[data-i="${i}"]`);
    if (btn && !btn.disabled) btn.click();
  });

  /* ---- 启动自检：题库写错时页面顶部报红条 ---- */
  const bankErrors = EN.validate();
  if (bankErrors.length){
    const box = $("alert");
    box.hidden = false;
    box.innerHTML = `<b>题库自检发现 ${bankErrors.length} 处问题：</b>
      <ul>${bankErrors.map(e => `<li>${e}</li>`).join("")}</ul>`;
    console.error("[题库自检]", bankErrors);
  }

  renderCover();
})();
</script>
</body>
</html>
